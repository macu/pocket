services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "2026:8080"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - GOOGLE_APPLICATION_CREDENTIALS=/var/run/google/application_default_credentials.json
    volumes:
      - .:/app
      - type: bind
        source: ${HOME}/.config/gcloud/application_default_credentials.json
        target: /var/run/google/application_default_credentials.json
        read_only: true
        bind:
          create_host_path: false

  db:
    image: postgres:latest
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-db:/var/lib/postgresql/data

volumes:

  postgres-db:
