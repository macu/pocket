<title>Pocket</title>

{{if .GAMeasurementID}}
<script>
if (window.localStorage.getItem('pocketCookieConsent') === 'accepted' &&
	window.localStorage.getItem('pocketTrackingDisabled') !== 'true') {
	window.dataLayer = window.dataLayer || [];
	window.gtag = function() { window.dataLayer.push(arguments); };
	window.gtag('js', new Date());
	window.gtag('config', '{{.GAMeasurementID}}', {send_page_view: false});
	const analyticsScript = document.createElement('script');
	analyticsScript.async = true;
	analyticsScript.src = 'https://www.googletagmanager.com/gtag/js?id={{.GAMeasurementID}}';
	document.head.appendChild(analyticsScript);
}
</script>
{{end}}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/element-plus/2.8.2/theme-chalk/index.min.css" integrity="sha512-Kpaxv77wr+LmDnHMPDhcyl3VgtrvR6n7Lw17PaD8VVzzHE0RMd8/sGrACS/BetY4LM4foQKBQEtlUNxyYa/wYA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<link rel="stylesheet" href="/css/compiled.css?v={{.VersionStamp}}"/>

<script>
// Constants defined in server code
window.appConstants = {
	local: {{.Local}},
	appVersion: "{{.VersionStamp}}", // version stamp at load time
	passwordMinLength: {{.PasswordMinLength}},
	handlePattern: {{.HandlePattern}},
	maxTopicPageSize: {{.MaxTopicPageSize}},
	maxTopicLength: {{.MaxTopicLength}},
	maxTopicSelectionCount: {{.MaxTopicSelectionCount}},
	postMaxLength: {{.MaxPostLength}},
	maxPostPageSize: {{.MaxPostPageSize}},
	maxNewPostTopics: {{.MaxNewPostTopics}},
	recaptchaKey: {{.RecaptchaKey}},
};
</script>

</head>
<body>

{{if .GAMeasurementID}}
<aside id="cookie-consent" class="cookie-consent" aria-label="Cookie notice">
	<div class="cookie-consent__content">
		<p>We use optional cookies to understand how this site is used. You can accept or reject them.</p>
		<div class="cookie-consent__actions">
			<button class="cookie-consent__button cookie-consent__button--accept" type="button" data-consent="accepted">Accept</button>
			<button class="cookie-consent__button cookie-consent__button--reject" type="button" data-consent="rejected">Reject</button>
		</div>
	</div>
</aside>
<script>
(function() {
	const consentKey = 'pocketCookieConsent';
	const banner = document.getElementById('cookie-consent');
	if (window.localStorage.getItem(consentKey) ||
		window.localStorage.getItem('pocketTrackingDisabled') === 'true') {
		banner.hidden = true;
	}
	banner.querySelectorAll('button[data-consent]').forEach(function(button) {
		button.addEventListener('click', function() {
			window.localStorage.setItem(consentKey, button.dataset.consent);
			if (button.dataset.consent === 'accepted') {
				window.location.reload();
			} else {
				banner.hidden = true;
			}
		});
	});
})();
</script>
{{end}}

<div id="app"></div>
